name: Bug report
description: Report something that is broken or confusing.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the command you ran and the terminal output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: false

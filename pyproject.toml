[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typing-bot"
version = "0.1.0"
description = "Fast Selenium and Playwright automation examples for the 10FastFingers typing test."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "maliboz" }
]
keywords = ["selenium", "playwright", "typing", "automation", "python", "turkish"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Testing",
  "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
selenium = ["selenium>=4.20"]
playwright = ["playwright>=1.44"]
all = ["selenium>=4.20", "playwright>=1.44"]
dev = []

[project.scripts]
typing-bot = "typing_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typing_coach = ["py.typed"]
